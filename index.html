<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kirim Pesan Anonim</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>

<style>
:root {
  --blue: #93C5FD;          
  --blue-soft: rgba(147, 197, 253, 0.4);
  --black: #0a0a0a;
  --white: #ffffff;
  --gray: #737373;          
  --gray-dark: #525252;
  --line: #e2e8f0;          
  --line-strong: #cbd5e1;
  --font-hand: "Nanum Pen Script", "Segoe Script", "Bradley Hand", cursive;
  --font-main: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: var(--font-main); background: var(--white); color: var(--black); -webkit-font-smoothing: antialiased; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea { font-family: inherit; }

.container { max-width: 1152px; margin: 0 auto; padding: 0 16px; }

.nav { position: sticky; top: 0; z-index: 30; background: rgba(255,255,255,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.nav-inner { max-width: 1152px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.logo { font-family: var(--font-hand); font-size: 26px; line-height: 1; }
.logo mark { background: rgba(147,197,253,.7); padding: 0 4px; border-radius: 4px; color: inherit; }
.tabs { display: flex; align-items: center; gap: 4px; }
.tab { padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; transition: background .15s; }
.tab:hover { background: var(--blue-soft); }
.tab.active { background: var(--blue); }
.count { margin-left: 6px; background: var(--black); color: var(--white); font-size: 10px; padding: 2px 6px; border-radius: 999px; }

.hero { max-width: 896px; margin: 0 auto; padding: 56px 16px 56px; text-align: center; }
.hero-badge { display: inline-block; background: var(--blue); padding: 4px 16px; border-radius: 999px; font-size: 12px; font-weight: 700; letter-spacing: .15em; }
.hero-title { font-family: var(--font-hand); font-weight: 400; font-size: 64px; line-height: 1.05; margin-top: 24px; }
.hero-title mark { background: rgba(147,197,253,.7); color: inherit; padding: 0 12px; border-radius: 12px; }
.hero-actions { margin-top: 40px; display: flex; flex-direction: column; align-items: stretch; gap: 12px; }

.btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 24px; border-radius: 12px; font-size: 14px; font-weight: 500; transition: all .15s; }
.btn-dark { background: #171717; color: var(--white); }
.btn-dark:hover { background: var(--blue); color: var(--black); }
.btn-outline { background: var(--white); border: 1px solid #171717; }
.btn-outline:hover { background: var(--blue-soft); }

.main { padding-top: 40px; padding-bottom: 40px; }
.main.with-hero { padding-top: 0; padding-bottom: 48px; }
.section-head { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
.section-head h2, .page-title { font-size: 24px; font-weight: 700; }
.page-sub { margin-top: 4px; font-size: 14px; color: var(--gray); }
.page-head { margin-bottom: 24px; }

.search { position: relative; width: 100%; }
.search input { width: 100%; padding: 10px 40px 10px 16px; border: 1px solid var(--line-strong); border-radius: 12px; font-size: 14px; outline: none; transition: all .15s; }
.search input:focus, .field:focus { border-color: var(--black); box-shadow: 0 0 0 4px rgba(147,197,253,.5); }
.search .clear { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 20px; line-height: 1; }

.grid { display: grid; grid-template-columns: 1fr; gap: 20px; }

.card { display: flex; flex-direction: column; justify-content: space-between; padding: 24px; background: var(--white); border: 1px solid var(--line); border-radius: 16px; cursor: pointer; transition: all .2s; }
.card:hover { transform: translateY(-4px); border-color: var(--blue); box-shadow: 0 8px 24px -8px rgba(147,197,253,.9); }
.card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.badge { display: inline-block; background: var(--blue); padding: 2px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; }
.date { font-size: 12px; color: var(--gray); }
.card-text { font-size: 15px; line-height: 1.65; color: var(--gray-dark); word-break: break-word; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.card-bottom { margin-top: 20px; display: flex; align-items: center; justify-content: space-between; font-size: 12px; }
.from { font-weight: 500; color: #262626; }
.read { font-weight: 500; opacity: 0; transition: opacity .15s; }
.card:hover .read { opacity: 1; }
.del-btn { padding: 4px 12px; border: 1px solid var(--line-strong); border-radius: 8px; font-size: 12px; font-weight: 500; transition: all .15s; }
.del-btn:hover { background: var(--black); color: var(--white); border-color: var(--black); }

.overlay { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(0,0,0,.6); backdrop-filter: blur(4px); }
.modal { width: 100%; max-width: 512px; max-height: 85vh; overflow-y: auto; padding: 24px; background: var(--white); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 25px 50px -12px rgba(0,0,0,.35); animation: pop .18s ease-out; }
.modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
.modal-head .date { margin-top: 8px; }
.close { width: 36px; height: 36px; border: 1px solid var(--line-strong); border-radius: 50%; font-size: 20px; line-height: 1; transition: background .15s; }
.close:hover { background: var(--blue); }
.modal-text { white-space: pre-wrap; word-break: break-word; font-size: 16px; line-height: 1.65; color: #404040; }
.modal-from { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 14px; font-weight: 600; }


.form { max-width: 576px; margin: 0 auto; padding: 20px; background: var(--white); border: 1px solid var(--line); border-radius: 16px; }
.form h2 { font-size: 20px; font-weight: 700; }
.form .page-sub { margin-bottom: 24px; }
.form label { display: block; margin-bottom: 4px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; }
.form label small { font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--gray); }
.field { width: 100%; padding: 12px 16px; border: 1px solid var(--line-strong); border-radius: 12px; font-size: 14px; outline: none; transition: all .15s; }
.field.mb { margin-bottom: 16px; }
textarea.field { min-height: 140px; resize: vertical; }
.counter { margin: 4px 0 16px; text-align: right; font-size: 12px; color: var(--gray); }
.error { margin-top: 16px; font-size: 14px; font-weight: 500; text-decoration: underline; text-decoration-color: var(--blue); text-decoration-thickness: 4px; }
.submit { width: 100%; margin-top: 24px; padding: 12px 20px; background: var(--blue); border-radius: 12px; font-size: 14px; font-weight: 700; transition: all .15s; }
.submit:hover { background: var(--black); color: var(--white); }

.empty { padding: 64px 24px; text-align: center; font-size: 14px; color: var(--gray); border: 1px dashed var(--line-strong); border-radius: 16px; }
.empty .link { font-weight: 700; color: var(--black); text-decoration: underline; text-decoration-color: var(--blue); text-decoration-thickness: 4px; text-underline-offset: 2px; }
.footer { padding: 24px 16px; text-align: center; font-size: 12px; color: var(--gray); border-top: 1px solid var(--line); }
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 50; padding: 10px 20px; background: var(--black); color: var(--white); border-radius: 999px; font-size: 14px; font-weight: 600; box-shadow: 0 10px 25px rgba(0,0,0,.25); animation: pop .18s ease-out; }
.toast i { display: inline-block; width: 8px; height: 8px; margin-right: 8px; background: var(--blue); border-radius: 50%; }

@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }
.toast { animation-name: popToast; }
@keyframes popToast { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }


@media (min-width: 640px) {
  .container { padding: 0 24px; }
  .nav-inner { padding: 12px 24px; }
  .logo { font-size: 32px; }
  .tabs { gap: 8px; }
  .tab { padding: 6px 16px; font-size: 14px; }
  .hero { padding: 96px 16px 80px; }
  .hero-title { font-size: 96px; }
  .hero-actions { flex-direction: row; justify-content: center; }
  .btn { width: auto; }
  .section-head { flex-direction: row; align-items: center; justify-content: space-between; }
  .search { width: 320px; }
  .grid { grid-template-columns: repeat(2, 1fr); }
  .modal { padding: 32px; }
  .form { padding: 32px; }
}

@media (min-width: 1024px) {
  .grid { grid-template-columns: repeat(3, 1fr); }
}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo } = React;

const KEY_ALL = "pa_messages_v1";
const KEY_MINE = "pa_mine_v1";

const load = (key, fallback) => {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) { return fallback; }
};
const save = (key, value) => {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
};

const SEED = [
  { id: "s1", to: "Satpam", from: "", text: "Buat bapak satpam yang nutupin helm saya pake plastik pas ujan biarga keujan, makasih banyak ya pak murah rezeki", ts: Date.now() - 86400000 * 3 },
  { id: "s2", to: "Dimas", from: "Teman sebangku", text: "Maaf ya soal minggu lalu. Aku gak bermaksud bikin kamu kesel. Yuk ngopi lagi kayak biasa.", ts: Date.now() - 86400000 * 2 },
  { id: "s3", to: "Kak Salsa", from: "", text: "Semangat terus kuliahnya! Dari jauh aku selalu lihat kamu berusaha keras, dan itu keren banget.", ts: Date.now() - 86400000 },
  { id: "s4", to: "Baak Teknokrat", from: "mahasiswa ftik", text: "Pelayanannya cepat tapi tolong diperbaiki keramahannya.", ts: Date.now() - 3600000 * 5 },
];

const fmt = (ts) =>
  new Date(ts).toLocaleDateString("id-ID", { day: "numeric", month: "short", year: "numeric" });

const PencilIcon = () => (
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z" /><path d="m15 5 4 4" />
  </svg>
);
const SearchIcon = () => (
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" />
  </svg>
);

function MessageCard({ m, onOpen, onDelete }) {
  return (
    <div className="card" onClick={() => onOpen(m)}>
      <div>
        <div className="card-top">
          <span className="badge">To: {m.to}</span>
          <span className="date">{fmt(m.ts)}</span>
        </div>
        <p className="card-text">{m.text}</p>
      </div>
      <div className="card-bottom">
        <span className="from">— {m.from || "Anonim"}</span>
        {onDelete ? (
          <button className="del-btn" onClick={(e) => { e.stopPropagation(); onDelete(m.id); }}>Hapus</button>
        ) : (
          <span className="read">Baca →</span>
        )}
      </div>
    </div>
  );
}

function Modal({ m, onClose }) {
  useEffect(() => {
    const h = (e) => e.key === "Escape" && onClose();
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  }, [onClose]);

  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <div>
            <span className="badge">To: {m.to}</span>
            <p className="date">{fmt(m.ts)}</p>
          </div>
          <button className="close" onClick={onClose} aria-label="Tutup">×</button>
        </div>
        <p className="modal-text">{m.text}</p>
        <p className="modal-from">— {m.from || "Anonim"}</p>
      </div>
    </div>
  );
}

function SendForm({ onSend }) {
  const [to, setTo] = useState("");
  const [from, setFrom] = useState("");
  const [text, setText] = useState("");
  const [error, setError] = useState("");
  const MAX = 700;

  const submit = () => {
    if (!to.trim() || !text.trim()) {
      setError("Nama penerima dan isi pesan wajib diisi.");
      return;
    }
    setError("");
    onSend({ to: to.trim(), from: from.trim(), text: text.trim() });
    setTo(""); setFrom(""); setText("");
  };

  return (
    <div className="form">
      <h2>Tulis pesan</h2>
      <p className="page-sub">Sampaikan apa yang sulit diucapkan langsung.</p>

      <label>To:</label>
      <input className="field mb" placeholder="Nama penerima" value={to} onChange={(e) => setTo(e.target.value)} maxLength={40} />

      <label>Pesan</label>
      <textarea className="field" placeholder="Tulis pesanmu di sini..." value={text} maxLength={MAX} onChange={(e) => setText(e.target.value)} />
      <div className="counter">{text.length}/{MAX}</div>

      <label>Dari <small>(opsional, kosongkan untuk anonim)</small></label>
      <input className="field" placeholder="Anonim" value={from} onChange={(e) => setFrom(e.target.value)} maxLength={30} />

      {error && <p className="error">{error}</p>}

      <button className="submit" onClick={submit}>Kirim Pesan</button>
    </div>
  );
}

function App() {
  const [messages, setMessages] = useState(() => {
    const stored = load(KEY_ALL, null);
    return stored && stored.length ? stored : SEED;
  });
  const [mine, setMine] = useState(() => load(KEY_MINE, []));
  const [tab, setTab] = useState("feed");
  const [query, setQuery] = useState("");
  const [active, setActive] = useState(null);
  const [toast, setToast] = useState("");

  useEffect(() => save(KEY_ALL, messages), [messages]);
  useEffect(() => save(KEY_MINE, mine), [mine]);

  const showToast = (t) => {
    setToast(t);
    setTimeout(() => setToast(""), 2200);
  };

  const sorted = useMemo(() => [...messages].sort((a, b) => b.ts - a.ts), [messages]);

  const filtered = useMemo(() => {
    const q = query.trim().toLowerCase();
    return q ? sorted.filter((m) => m.to.toLowerCase().includes(q)) : sorted;
  }, [sorted, query]);

  const history = useMemo(() => sorted.filter((m) => mine.includes(m.id)), [sorted, mine]);

  const send = (data) => {
    const id = "m" + Date.now() + Math.random().toString(36).slice(2, 7);
    setMessages((prev) => [{ id, ...data, ts: Date.now() }, ...prev]);
    setMine((prev) => [id, ...prev]);
    setTab("feed");
    setQuery("");
    window.scrollTo({ top: 0 });
    showToast("Pesan terkirim!");
  };

  const remove = (id) => {
    if (!confirm("Hapus pesan ini?")) return;
    setMessages((prev) => prev.filter((m) => m.id !== id));
    setMine((prev) => prev.filter((x) => x !== id));
  };

  const goFeed = () => {
    const el = document.getElementById("feed");
    if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
  };

  const tabs = [
    { id: "feed", label: "Feed" },
    { id: "send", label: "Kirim" },
    { id: "history", label: "History Saya", count: history.length },
  ];

  const Empty = ({ children }) => <div className="empty">{children}</div>;

  return (
    <div>
      {/* Navbar */}
      <nav className="nav">
        <div className="nav-inner">
          <button className="logo" onClick={() => { setTab("feed"); window.scrollTo({ top: 0, behavior: "smooth" }); }}>
            Send The <mark>Message</mark>
          </button>
          <div className="tabs">
            {tabs.map((t) => (
              <button
                key={t.id}
                className={"tab" + (tab === t.id ? " active" : "")}
                onClick={() => { setTab(t.id); window.scrollTo({ top: 0 }); }}
              >
                {t.label}
                {t.count > 0 && <span className="count">{t.count}</span>}
              </button>
            ))}
          </div>
        </div>
      </nav>

      {/* Hero */}
      {tab === "feed" && (
        <header className="hero">
          <span className="hero-badge">ANONYMOUS MESSAGES</span>
          <h1 className="hero-title">Send The <mark>Message</mark></h1>
          <div className="hero-actions">
            <button className="btn btn-dark" onClick={() => setTab("send")}><PencilIcon /> Kirim Pesan</button>
            <button className="btn btn-outline" onClick={goFeed}><SearchIcon /> Pesan Publik</button>
          </div>
        </header>
      )}

      <main className={"container main" + (tab === "feed" ? " with-hero" : "")}>
        {tab === "feed" && (
          <section id="feed">
            <div className="section-head">
              <h2>Pesan Publik</h2>
              <div className="search">
                <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Cari nama penerima..." />
                {query && <button className="clear" onClick={() => setQuery("")} aria-label="Hapus pencarian">×</button>}
              </div>
            </div>

            {filtered.length === 0 ? (
              <Empty>
                {query ? <>Tidak ada pesan untuk "<b>{query}</b>".</> : "Belum ada pesan. Jadilah yang pertama!"}
              </Empty>
            ) : (
              <div className="grid">
                {filtered.map((m) => <MessageCard key={m.id} m={m} onOpen={setActive} />)}
              </div>
            )}
          </section>
        )}

        {tab === "send" && <SendForm onSend={send} />}

        {tab === "history" && (
          <section>
            <div className="page-head">
              <h2 className="page-title">History Saya</h2>
              <p className="page-sub">Pesan yang kamu kirim dari perangkat ini. Tersimpan otomatis di browser.</p>
            </div>
            {history.length === 0 ? (
              <Empty>
                Kamu belum mengirim pesan apa pun.{" "}
                <button className="link" onClick={() => setTab("send")}>Kirim sekarang</button>
              </Empty>
            ) : (
              <div className="grid">
                {history.map((m) => <MessageCard key={m.id} m={m} onOpen={setActive} onDelete={remove} />)}
              </div>
            )}
          </section>
        )}
      </main>

      <footer className="footer">
        Data disimpan di LocalStorage browser kamu · Jaga kata-katamu, sampaikan dengan baik.
      </footer>

      {active && <Modal m={active} onClose={() => setActive(null)} />}
      {toast && <div className="toast"><i></i>{toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
